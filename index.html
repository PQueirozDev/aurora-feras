<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101018" />
  <title>Aurora: Caçadores de Feras</title>
</head>
<body>
  <div id="app">
    <div id="screen-wrap"><canvas id="game"></canvas></div>
    <div id="pad">
      <div id="dpad">
        <div class="d up" data-dir="up"></div>
        <div class="d left" data-dir="left"></div>
        <div class="d mid"></div>
        <div class="d right" data-dir="right"></div>
        <div class="d down" data-dir="down"></div>
      </div>
      <div id="sys">
        <button class="sb" data-btn="select">SELECT</button>
        <button class="sb" data-btn="start">START</button>
      </div>
      <div id="ab">
        <button class="ab b" data-btn="b">B</button>
        <button class="ab a" data-btn="a">A</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
